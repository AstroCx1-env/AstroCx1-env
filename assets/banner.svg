<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Astro — TI, Redes, Back-End and Security</title>
  <desc id="desc">Dark banner with green, terminal-inspired details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="100%" stop-color="#111817"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#39d353" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <path d="M0 240 C240 180 360 330 610 230 S980 140 1200 210" fill="none" stroke="#39d353" stroke-opacity=".2" stroke-width="2"/>
  <rect x="64" y="54" width="8" height="192" rx="4" fill="#39d353"/>
  <text x="100" y="124" fill="#39d353" font-family="monospace" font-size="20">$ whoami</text>
  <text x="100" y="178" fill="#f0f6fc" font-family="monospace" font-size="52" font-weight="700">ASTRO</text>
  <text x="103" y="218" fill="#c9d1d9" font-family="monospace" font-size="21">TI · REDES · BACK-END · SEGURANÇA</text>
  <text x="103" y="254" fill="#39d353" font-family="monospace" font-size="16">One step at a time..._</text>
  <g fill="#39d353" opacity=".75" font-family="monospace" font-size="14">
    <text x="875" y="86">01 // NETWORKS</text>
    <text x="875" y="116">02 // LINUX</text>
    <text x="875" y="146">03 // BACK-END</text>
    <text x="875" y="176">04 // CYBERSECURITY</text>
    <text x="875" y="206">STATUS: LEARNING</text>
  </g>
  <circle cx="1110" cy="245" r="5" fill="#39d353"/>
  <text x="1125" y="250" fill="#c9d1d9" font-family="monospace" font-size="13">ONLINE</text>
</svg>
